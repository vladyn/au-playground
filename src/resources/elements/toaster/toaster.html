<template>
  <require from="./toaster.css"></require>

  <div class="toaster" class.bind="toastType" mouseout.trigger="hideWithDelay()">
    <div class="close-button" click.trigger="hide()">&times;</div>
    <h4>${title}</h4>
    <slot>
      <div class="toaster-wrapper">
        <i class="fa-solid fa-triangle-exclamation size-xxl"></i>
        <p>${message}</p>
      </div>
    </slot>
  </div>
</template>
